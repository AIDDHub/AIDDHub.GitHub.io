{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <div class="container">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="{{ home_href }}">{{ nav_text.home }}</a>
      <span class="sep">/</span>
      <span aria-current="page">{{ page.title }}</span>
    </nav>
    <h1>{{ page.title }}</h1>
{% if page.description %}
    <p>{{ page.description }}</p>
{% endif %}
  </div>
</section>

<section class="container">
  <div class="prose">
{{ page.body|safe }}
  </div>
</section>
{% endblock %}
